name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      build_image:
        description: Build a disposable image for validation (delivery builds its own image).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm
        run: corepack enable && corepack install --global pnpm@10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Verify Cloud SQL PostgreSQL 17 role semantics
        timeout-minutes: 10
        run: pnpm test:postgres:fresh

      - name: Build delivery image
        if: ${{ github.event_name == 'pull_request' || inputs.build_image }}
        run: docker build --tag oao:ci .
